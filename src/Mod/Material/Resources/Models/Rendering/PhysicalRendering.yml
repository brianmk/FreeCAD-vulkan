AppearanceModel:
  Name: "Physical Rendering"
  UUID: 'cb5fdb3f-9145-484f-8889-f73d6d4d1912'
  URL: ''
  Description: "physically based metallic-roughness rendering model"
  DOI: ""
  Inherits:
    - BasicRendering:
      UUID: 'f006c7e4-35b7-43d5-bbf9-c5d572309e6e'
  Metallic:
    DisplayName: "Metallic"
    Type: 'Float'
    Units: ''
    URL: ''
    Description: >
      Metallic amount of the physically based metallic-roughness model.
      0 is a dielectric (plastic, concrete, wood), 1 is a conductor (metal).
      Only used when the appearance is rendered with the physical material
      path.
  Roughness:
    DisplayName: "Roughness"
    Type: 'Float'
    Units: ''
    URL: ''
    Description: >
      Perceptual roughness of the physically based metallic-roughness model.
      0 is a mirror-like surface and 1 is fully diffuse.
  TransmissionIor:
    DisplayName: "Transmission IOR"
    Type: 'Float'
    Units: ''
    URL: ''
    Description: >
      Index of refraction of the transmissive (glass) response. 1.5 is window
      glass; 1.0 is air (no bending). Only used when the appearance is rendered
      with the physical material path and the material is transparent.
  TransmissionAbsorption:
    DisplayName: "Transmission Absorption"
    Type: 'Float'
    Units: ''
    URL: ''
    Description: >
      Beer-Lambert absorption strength of the transmissive (glass) response.
      0 is a perfectly clear glass; higher values tint the transmission with
      distance through the medium. Only used when the appearance is rendered
      with the physical material path and the material is transparent.
