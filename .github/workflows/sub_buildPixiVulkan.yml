# Fork-only variant of sub_buildPixi.yml that builds against the bundled
# Coin/Pivy submodules with the experimental Vulkan viewport enabled
# (FREECAD_USE_VULKAN=ON).  It keeps FREECAD_USE_EXTERNAL_COIN_PIVY OFF (the
# pixi conda presets already default to bundled Coin) so the fork's
# SoIRRenderAction / Vulkan-renderer code is compiled and, on Linux, exercised
# by the C++ and GUI tests through a headless Mesa lavapipe software ICD.
#
# The Vulkan SDK is installed per-OS inside the job rather than as a pixi
# dependency (conda is optional and not required), so the pinned pixi.lock needs
# no regeneration.  On Linux that comes from apt (libvulkan-dev + lavapipe); on
# Windows from the official Vulkan SDK.  The bundled Coin consumes it through
# CMake's find_package(Vulkan) -- on Windows the configure step passes the SDK's
# Include/Lib paths explicitly so FindVulkan resolves them reliably.
#
# This only ADDS coverage; the stock sub_buildPixi.yml / sub_buildWindows.yml
# approval lane is untouched and still builds with Vulkan OFF.  Windows is
# included because the pixi conda-windows preset also builds bundled Coin, so
# this exercises the MSVC /WX and clang-cl axes against the Vulkan sources that
# the stock (LibPack / external-Coin) Windows job never sees.

name: Pixi Builds (bundled Coin + Vulkan)

on:
  workflow_call:
    inputs:
      artifactBasename:
        type: string
        required: true
      testOnBuildDir:
        default: false
        type: boolean
        required: false
      testCoinNodeSnapshots:
        default: true
        type: boolean
        required: false
      skipBuild:
        default: false
        type: boolean
        required: false
      allowedToFail:
        default: false
        type: boolean
        required: false
    outputs:
      reportFile:
        value: ${{ jobs.build_with_pixi.outputs.reportFile }}

permissions:
  contents: read

jobs:
  build_with_pixi:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ inputs.allowedToFail }}
    env:
      CCACHE_COMPRESS: true
      CCACHE_COMPRESSLEVEL: 5
      CCACHE_CONFIGPATH: ${{ github.workspace }}/ccache/config
      CCACHE_DIR: ${{ github.workspace }}/ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_NODIRECT: true
      CCACHE_NOHASHDIR: true
      CCACHE_NOINODECACHE: true
      CCACHE_SLOPPINESS: "include_file_ctime,include_file_mtime,pch_defines,time_macros"
      builddir: ${{ github.workspace }}/build/release/
      cacheKey: pixivk-${{ matrix.os }}
      config: release
      logdir: ${{ github.workspace }}/logs/
      reportdir: ${{ github.workspace }}/report/
      reportfilename: ${{ inputs.artifactBasename }}-${{ matrix.os }}-report.md
      shellCmd: "pixi run bash -l {0}"
      # Headless software Vulkan driver so the Linux GUI tests can create a
      # device.  The bundled Coin links conda's vulkan-loader; pointing it at
      # the system lavapipe ICD gives a real device with no GPU.  Ignored on
      # Windows, where no GUI test runs.
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
    outputs:
      reportFile: ${{ steps.Init.outputs.reportFile }}

    strategy:
      max-parallel: 6
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]

    steps:
    - name: Harden the runner (Audit all outbound calls)
      if: "!inputs.skipBuild"
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit

    - name: Set Platform Environment Variables
      if: "!inputs.skipBuild"
      shell: bash -l {0}
      env:
        OPERATING_SYSTEM: ${{ runner.os }}
      run: |
        if [[ $OPERATING_SYSTEM == 'Windows' ]]; then
          echo 'CCACHE_COMPILERCHECK=%compiler%' >> "$GITHUB_ENV"
        else
          echo 'CCACHE_COMPILERCHECK=%compiler% -dumpfullversion -dumpversion' >> "$GITHUB_ENV"
        fi

    - name: Checkout
      if: "!inputs.skipBuild"
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        submodules: true

    - name: Add GCC Problem Matcher
      if: runner.os == 'Linux' && !inputs.skipBuild
      run: |
        echo "::add-matcher::${{ github.workspace }}/.github/problemMatcher/gcc.json"

    - name: Add Clang Problem Matcher
      if: runner.os == 'macOS' && !inputs.skipBuild
      run: |
        echo "::add-matcher::${{ github.workspace }}/.github/problemMatcher/clang.json"

    - name: Add MSVC++ Problem Matcher
      if: runner.os == 'Windows' && !inputs.skipBuild
      run: |
        echo "::add-matcher::${{ github.workspace }}/.github/problemMatcher/msvc.json"

    - name: Install Vulkan software driver (Linux)
      if: runner.os == 'Linux' && !inputs.skipBuild
      run: |
        sudo apt-get update -y -qq
        sudo apt-get install -y -qq \
          libvulkan1 \
          libvulkan-dev \
          mesa-vulkan-drivers \
          vulkan-tools

    - name: Install Vulkan SDK (Windows)
      if: runner.os == 'Windows' && !inputs.skipBuild
      # Provides the Vulkan SDK on the Windows pixi build.  It writes VULKAN_SDK
      # to GITHUB_ENV and is consumed by CMake's find_package(Vulkan).
      uses: humbletim/install-vulkan-sdk@v1.2

    - name: Repoint VULKAN_SDK to the extracted SDK root (Windows)
      if: runner.os == 'Windows' && !inputs.skipBuild
      shell: bash
      run: |
        set +e
        # The LunarG installer may unpack flat into $VULKAN_SDK or into a
        # versioned subdir.  Locate the real SDK root (the dir containing the
        # Vulkan headers) so CMake's find_package(Vulkan) sees Include/Lib, then
        # point VULKAN_SDK at it.  Do not assume a layout or a fixed case.
        ROOT="${VULKAN_SDK}"
        VH="$(find "${VULKAN_SDK}" -type f -name vulkan.h \
                -path '*/vulkan/vulkan.h' 2>/dev/null | head -1)"
        if [[ -n "$VH" ]]; then
          ROOT="$(dirname "$(dirname "$(dirname "$VH")")")"   # strip include/vulkan/vulkan.h
          if [[ "$ROOT" != "${VULKAN_SDK}" ]]; then
            echo "VULKAN_SDK=$ROOT" >> "$GITHUB_ENV"
            echo "Repointed VULKAN_SDK from ${VULKAN_SDK} to $ROOT"
          fi
        fi
        echo "--- ${ROOT} top-level layout ---"
        ls -la "${ROOT}" 2>/dev/null | head -30 || true
        if [[ ! -f "${ROOT}/include/vulkan/vulkan.h" && \
              ! -f "${ROOT}/Include/vulkan/vulkan.h" ]]; then
          echo "::error::Vulkan headers not found under ${ROOT}"
          echo "VULKAN_SDK was: ${VULKAN_SDK}"
          exit 1
        fi
        echo "::notice::Vulkan SDK root = ${ROOT}"

    - name: Make needed directories, files and initializations
      if: "!inputs.skipBuild"
      id: Init
      run: |
        mkdir -p ${{ env.builddir }}
        mkdir -p ${{ env.logdir }}
        mkdir -p ${{ env.reportdir }}
        echo "reportFile=${{ env.reportfilename }}" >> $GITHUB_OUTPUT

    - if: "!inputs.skipBuild"
      uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
      with:
        pixi-version: v0.68.1
        cache: false

    - name: Restore Compiler Cache
      id: cache-restore
      if: "!inputs.skipBuild"
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: FC-PIXIVK-${{ env.cacheKey }}-${{ github.ref }}-${{ github.run_id }}
        restore-keys: |
          FC-PIXIVK-${{ env.cacheKey }}-${{ github.ref }}-
          FC-PIXIVK-${{ env.cacheKey }}-

    - name: Print CCache statistics before build, reset stats and print config
      if: "!inputs.skipBuild"
      run: |
        pixi run ccache -s
        pixi run ccache -z
        pixi run ccache -p

    - name: CMake Configure
      if: "!inputs.skipBuild"
      shell: bash
      run: |
        # Call cmake directly (not the pixi configure-release task) so we can
        # pass multiple extra flags.  The task has a single declared arg, which
        # pixi rejects when given several -D flags.
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          PRESET=conda-windows-release
          GEN_ARGS=(-DCMAKE_GENERATOR_PLATFORM= -DCMAKE_GENERATOR_TOOLSET=)
        else
          PRESET=conda-linux-release
          GEN_ARGS=()
        fi
        # Vulkan is found by CMake's find_package(Vulkan) via VULKAN_SDK
        # (Windows SDK action / repoint step) or the conda vulkan-headers on
        # Linux.  Do not hardcode Include/Lib: the SDK layout is versioned.
        pixi run cmake --preset "${PRESET}" -DFREECAD_USE_VULKAN=ON \
          "${GEN_ARGS[@]}"

    - name: CMake Build
      if: "!inputs.skipBuild"
      run: |
        pixi run build-release

    - name: Print ccache statistics after Build
      if: "!inputs.skipBuild"
      run: |
        pixi run ccache -s

    - name: FreeCAD CLI tests on build dir
      if: inputs.testOnBuildDir && !inputs.skipBuild
      timeout-minutes: 10
      uses: ./.github/workflows/actions/runPythonTests
      with:
        testDescription: "CLI tests on build dir"
        testCommand: ${{ env.builddir }}/bin/FreeCADCmd -t 0
        logFile: ${{ env.logdir }}TestCLIBuild.log
        reportFile: ${{env.reportdir}}${{ env.reportfilename }}
        shellCmd: ${{ env.shellCmd }}

    - name: FreeCAD GUI tests on build dir
      if: runner.os == 'Linux' && inputs.testOnBuildDir && !inputs.skipBuild
      timeout-minutes: 15
      uses: ./.github/workflows/actions/runPythonTests
      with:
        testDescription: "GUI tests on build dir"
        testCommand: xvfb-run ${{ env.builddir }}/bin/FreeCAD -t 0
        logFile: ${{ env.logdir }}TestGUIBuild.log
        reportFile: ${{env.reportdir}}${{ env.reportfilename }}
        shellCmd: ${{ env.shellCmd }}

    - name: Coin node snapshot visual tests on build dir
      if: runner.os == 'Linux' && inputs.testCoinNodeSnapshots && !inputs.skipBuild
      timeout-minutes: 15
      uses: ./.github/workflows/actions/runPythonTests
      with:
        testDescription: "Coin node snapshot visual tests on build dir"
        testCommand: |
          FC_VISUAL_OUT_DIR="/tmp/FreeCADTesting/CoinNodeSnapshots" \
          xvfb-run -a -s "-screen 0 1024x768x24" \
            "${{ env.builddir }}/bin/FreeCAD" -t TestCoinNodeSnapshots
        logFile: ${{ env.logdir }}TestCoinNodeSnapshotsBuild.log
        reportFile: ${{env.reportdir}}${{ env.reportfilename }}
        shellCmd: ${{ env.shellCmd }}

    - name: Upload Coin node snapshot artifacts (on failure)
      if: failure() && runner.os == 'Linux' && inputs.testCoinNodeSnapshots && !inputs.skipBuild
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifactBasename }}-${{ matrix.os }}-CoinNodeSnapshots
        path: /tmp/FreeCADTesting/CoinNodeSnapshots

    - name: src/Tools tests
      if: "!inputs.skipBuild"
      run: pixi run python -m unittest discover -s src/Tools/tests -p "test_*.py"

    - name: C++ tests
      timeout-minutes: 10
      if: runner.os != 'Windows' && !inputs.skipBuild
      uses: ./.github/workflows/actions/runCPPTests/runAllTests
      with:
        reportdir: ${{ env.reportdir }}
        builddir: ${{ env.builddir }}
        reportFile: ${{ env.reportdir }}${{ env.reportfilename }}
        shellCmd: ${{ env.shellCmd }}

    - name: CMake Install
      if: "!inputs.skipBuild"
      run: |
        pixi run install-release

    - name: FreeCAD CLI tests on install
      if: runner.os != 'Windows' && !inputs.skipBuild
      timeout-minutes: 10
      uses: ./.github/workflows/actions/runPythonTests
      with:
        testDescription: "CLI tests on install"
        testCommand: FreeCADCmd -t 0
        logFile: ${{ env.logdir }}TestCLIInstall.log
        reportFile: ${{env.reportdir}}${{ env.reportfilename }}
        shellCmd: ${{ env.shellCmd }}

    - name: FreeCAD GUI tests on install
      # currently broken on Qt6 builds
      if: false
      timeout-minutes: 15
      uses: ./.github/workflows/actions/runPythonTests
      with:
        testDescription: "GUI tests on install"
        testCommand: xvfb-run FreeCAD -t 0
        logFile: ${{ env.logdir }}TestGUIInstall.log
        reportFile: ${{env.reportdir}}${{ env.reportfilename }}
        shellCmd: ${{ env.shellCmd }}

    - name: Save Compiler Cache
      id: cache-save
      if: "!inputs.skipBuild"
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: FC-PIXIVK-${{ env.cacheKey }}-${{ github.ref }}-${{ github.run_id }}

    - name: Upload logs
      if: "!inputs.skipBuild"
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifactBasename }}-${{ matrix.os }}-Logs
        path: |
          ${{ env.logdir }}
          /var/crash/*FreeCAD*

    - name: Upload report
      if: "!inputs.skipBuild"
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ env.reportfilename }}
        path: |
          ${{env.reportdir}}${{ env.reportfilename }}
